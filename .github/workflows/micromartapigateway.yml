name: Build and deploy .NET application to container app micromartapigateway
on:
  push:
    branches:
    - dev

# REMOVED the permissions block that was causing OIDC issues

env:
  CONTAINER_APP_CONTAINER_NAME: micromartapigateway
  CONTAINER_APP_NAME: micromartapigateway
  CONTAINER_APP_RESOURCE_GROUP_NAME: micro-mart
  CONTAINER_REGISTRY_LOGIN_SERVER: micromartrg.azurecr.io
  DOCKER_FILE_PATH: src/ApiGateway/Dockerfile
  PROJECT_NAME_FOR_DOCKER: micromartapigateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.micromartRg_USERNAME_8D63 }}
        password: ${{ secrets.micromartRg_PASSWORD_8D63 }}
        
    - name: Build and push container image to registry
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
        file: ${{ env.DOCKER_FILE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        # Using creds parameter with JSON string for service principal authentication
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
        
    - name: Deploy to containerapp
      uses: azure/CLI@v2
      with:
        inlineScript: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp registry set --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} \
            --server ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} \
            --username ${{ secrets.micromartRg_USERNAME_8D63 }} \
            --password ${{ secrets.micromartRg_PASSWORD_8D63 }}
          az containerapp update --name ${{ env.CONTAINER_APP_NAME }} \
            --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} \
            --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} \
            --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
            
    - name: logout
      run: az logout
      if: always()  # This ensures logout runs even if previous steps fail
