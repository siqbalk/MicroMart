version: '3.8'

services:

  apigateway:
    container_name: apigateway
    build:
      context: ./src/ApiGateway
      dockerfile: Dockerfile
    ports:
      - "8801:8080"
    depends_on:
      - productservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  productservice:
    container_name: productservice
    build:
      context: ./src/Services/ProductCatalog
      dockerfile: Dockerfile
    ports:
      - "8802:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development